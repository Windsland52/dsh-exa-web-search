name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    if: github.repository == 'Windsland52/dsh-exa-web-search'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Pack on the oldest supported major, so the released files are produced by the runtime
          # the package claims to support.
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          # Trusted publishing authorizes this workflow file, not a ref, so the ref has to be pinned
          # to a tag here: a branch that happens to be named v<version> must not publish.
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "Publishing requires a tag ref; received ${GITHUB_REF}." >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Tag version ${tag_version} does not match package version ${package_version}." >&2
            exit 1
          fi

      # The same checks check.yml runs, repeated here on purpose: publishing is irreversible, so
      # it must not assume some earlier run passed. The live network smoke test stays out of both:
      # it reaches Exa's public endpoint and would make the pipeline flaky.
      - name: Run tests
        run: npm test

      - name: Check the published file set
        run: npm run test:install

      - name: Pack release tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          pack_root="${RUNNER_TEMP}/dsh-exa-web-search-package"
          rm -rf "${pack_root}"
          mkdir -p "${pack_root}"
          npm pack --pack-destination "${pack_root}"
          mapfile -t tarballs < <(find "${pack_root}" -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected one release tarball, found ${#tarballs[@]}." >&2
            exit 1
          fi
          printf 'pack_dir=%s\n' "${pack_root}" >> "${GITHUB_OUTPUT}"

      # The pack directory is uploaded through a wildcard on purpose: a wildcard makes the artifact
      # root the directory itself, so the tarball lands at the artifact root instead of nested under
      # its parent directory name.
      - name: Upload release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.pack_dir }}/*.tgz
          if-no-files-found: error

  publish:
    needs: pack
    if: github.repository == 'Windsland52/dsh-exa-web-search'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist/npm

      # No registry-url and no NODE_AUTH_TOKEN on purpose: publishing authenticates through npm
      # trusted publishing (OIDC), and setup-node's registry-url writes an .npmrc whose placeholder
      # token can shadow the OIDC exchange, which npm then reports as a masked E404 on PUT.
      # The tarball is published as-is, so no install and no build happen in this job.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 22 still bundles npm 10; trusted publishing needs npm >= 11.5.1.
          node-version: 24

      - name: Publish release tarball
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          # Trusted publishing requires npm >= 11.5.1. Fail loudly here rather than letting it
          # surface later as the masked E404 that npm returns for any authentication failure.
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) {
              console.error(`npm ${process.argv[1]} does not support trusted publishing (need >= 11.5.1)`);
              process.exit(1);
            }
          ' "$npm_version"

          mapfile -t tarballs < <(find dist/npm -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected one release tarball in the artifact, found ${#tarballs[@]}." >&2
            exit 1
          fi
          tarball="${tarballs[0]}"

          # Read the identity from the artifact itself: the already-published check must describe
          # what would actually be uploaded, not what the checked-out tree claims.
          metadata_root="${RUNNER_TEMP}/dsh-exa-web-search-package-metadata"
          rm -rf "${metadata_root}"
          mkdir -p "${metadata_root}"
          tar -xzf "${tarball}" -C "${metadata_root}" package/package.json
          package_name="$(node -e 'process.stdout.write(require(process.argv[1]).name)' "${metadata_root}/package/package.json")"
          package_version="$(node -e 'process.stdout.write(require(process.argv[1]).version)' "${metadata_root}/package/package.json")"
          package_ref="${package_name}@${package_version}"

          # Idempotent: re-running a workflow for a tag whose version already landed is a no-op.
          if npm_view_output=$(npm view "${package_ref}" version 2>&1); then
            echo "${package_ref} already exists on npm; publish will be skipped."
            exit 0
          elif grep -q 'E404' <<< "${npm_view_output}"; then
            echo "${package_ref} is not published yet."
          else
            echo "Unable to query ${package_ref} on npm:" >&2
            echo "${npm_view_output}" >&2
            exit 1
          fi

          # A stale token in any npmrc would shadow the OIDC exchange, so drop it explicitly.
          npm config delete "//registry.npmjs.org/:_authToken" >/dev/null 2>&1 || true

          # --loglevel verbose is load-bearing: npm's trusted-publishing exchange swallows its own
          # errors and only logs the reason at verbose level, so without it an auth failure surfaces
          # as a bare ENEEDAUTH with no cause.
          # Provenance is explicit: it comes from the same OIDC identity, and losing it silently
          # would be a supply-chain regression.
          npm publish "${tarball}" --access public --provenance --loglevel verbose

  release:
    needs: [pack, publish]
    if: github.repository == 'Windsland52/dsh-exa-web-search'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The notes are the tagged tree's own CHANGELOG sections, so both changelogs and the
      # extractor are read from the tag rather than from a branch head.
      # Shape follows the Host's own releases: a language switcher on top, Chinese first, then
      # English below it, each block anchored so the switcher can jump to it.
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; skipping creation."
            exit 0
          fi
          version="${VERSION#v}"
          notes="${RUNNER_TEMP}/release-notes.md"
          {
            printf '[中文](#cn-%s) | [English](#en-%s)\n\n' "${version}" "${version}"
            printf '<h3 id="cn-%s">中文</h3>\n\n' "${version}"
            node scripts/release-notes.mjs "${version}" CHANGELOG.md
            printf '\n<h3 id="en-%s">English</h3>\n\n' "${version}"
            node scripts/release-notes.mjs "${version}" CHANGELOG.en.md
            printf '\n'
          } > "${notes}"
          # The tag already exists (pushing it triggered this workflow), so --verify-tag makes gh
          # fail instead of silently creating the release on the checked-out commit.
          gh release create "${VERSION}" --verify-tag \
            --title "${VERSION}" --notes-file "${notes}"
