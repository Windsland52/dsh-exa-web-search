name: Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.19.0 is the floor declared in engines: running it here is what stops an API that
        # needs a newer runtime from reaching a user's install. 24 keeps coverage on the current
        # major.
        node: ['22.19.0', '24']

    name: Node.js ${{ matrix.node }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Behaviour tests plus manifest contract checks: the Config schema, the bundle patch, the
      # published file set, the icon limits and the README/schema agreement.
      - name: Run tests
        run: npm test

      # What npm pack would actually ship. This catches a files entry that drops lib/client.js or
      # locale/, which no amount of local testing reveals.
      - name: Check the published file set
        run: npm run test:install
